name: arabidopsis-tropism
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  # Python
  - python=3.11
  - pip
  - numpy>=1.24
  - pandas>=2.0
  - scipy>=1.10
  - scikit-learn>=1.3
  - statsmodels>=0.14
  - matplotlib>=3.7
  - seaborn>=0.12
  - pytorch>=2.0
  - pytorch-lightning>=2.0
  - tensorboard>=2.13
  - xlrd>=2.0
  # R
  - r-base=4.4
  - r-ggplot2>=3.4
  - r-dplyr>=1.1
  - r-tidyr>=1.3
  - r-readr>=2.1
  - r-stringr>=1.5
  - r-pheatmap>=1.0.12
  - r-rcolorbrewer>=1.1
  - r-metafor>=4.2
  - r-tidygraph>=1.3
  - r-ggraph>=2.1
  - r-remotes>=2.4
  # Bioconductor
  - bioconductor-deseq2>=1.40
  - bioconductor-org.at.tair.db>=3.18
  - bioconductor-reactome.db>=1.86
  - bioconductor-singler>=2.4
  - bioconductor-scran>=1.30
  - bioconductor-scater>=1.30
  - bioconductor-annotationdbi>=1.64
  # pip packages
  - pip:
    - biomni.tool
