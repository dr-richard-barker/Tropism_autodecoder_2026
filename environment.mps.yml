# Apple Silicon (arm64 / Metal-MPS) environment for the full-atlas retrain.
# For Macs with an Apple GPU — uses PyTorch's MPS backend instead of CUDA.
# Create with:  mamba env create -f environment.mps.yml   (miniforge/mambaforge, osx-arm64)
# Then:  python Code/train_autodecoder_gpu.py --accelerator mps --in-memory --num-workers 0 ...
name: arabidopsis-tropism-mps
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - numpy>=1.24
  - pandas>=2.0
  - scipy>=1.10
  - scikit-learn>=1.3
  # PyTorch osx-arm64 conda-forge build ships the MPS (Metal) backend — no CUDA.
  - pytorch>=2.2
  - pytorch-lightning>=2.1
  # R + Seurat for Code/export_atlas.R (atlas extraction from the .rds)
  - r-base=4.4
  - r-seurat>=5.0
  - r-matrix
