# GPU environment for full-atlas auto-decoder training.
# Differs from the repo's environment.yml only in the PyTorch stack (CUDA build).
# Create with:  mamba env create -f environment.gpu.yml
# Requires an NVIDIA driver compatible with CUDA 12.1 on the host.
name: arabidopsis-tropism-gpu
channels:
  - pytorch
  - nvidia
  - conda-forge
  - bioconda
  - defaults
dependencies:
  - python=3.11
  - pip
  - numpy>=1.24
  - pandas>=2.0
  - scipy>=1.10
  - scikit-learn>=1.3
  - statsmodels>=0.14
  - matplotlib>=3.7
  - seaborn>=0.12
  # --- GPU PyTorch stack (replaces the CPU pytorch in environment.yml) ---
  - pytorch>=2.1
  - pytorch-cuda=12.1
  - pytorch-lightning>=2.1
  - tensorboard>=2.13
  - xlrd>=2.0
  # --- R + Bioconductor (unchanged from environment.yml; needed for extraction/DE/viz) ---
  - r-base=4.4
  - r-seurat>=5.0
  - r-ggplot2>=3.4
  - r-dplyr>=1.1
  - r-tidyr>=1.3
  - r-readr>=2.1
  - r-stringr>=1.5
  - r-pheatmap>=1.0.12
  - r-rcolorbrewer>=1.1
  - r-metafor>=4.2
  - r-tidygraph>=1.3
  - r-ggraph>=2.1
  - r-remotes>=2.4
  - bioconductor-deseq2>=1.40
  - bioconductor-org.at.tair.db>=3.18
  - bioconductor-reactome.db>=1.86
  - bioconductor-singler>=2.4
  - bioconductor-scran>=1.30
  - bioconductor-scater>=1.30
  - bioconductor-annotationdbi>=1.64
